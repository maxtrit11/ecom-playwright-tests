[pytest]
testpaths = tests
base_url = https://stage.ecom.md/ru
# stage.ecom.md залипает под нагрузкой при длинном последовательном прогоне —
# отдельные e2e падают по таймауту, но проходят при повторе. Перепрогоняем
# упавшие до 2 раз с паузой, чтобы итог отражал реальное состояние, а не флак.
#
# --timeout ЗДЕСЬ НЕ СТАВИТЬ. pytest-timeout выбирает метод по платформе:
# на Linux (CI) — signal, который снимает один зависший тест; на Windows —
# thread, который умеет только УБИТЬ ВЕСЬ ПРОЦЕСС pytest. Проверено 2026-07-29:
# stage отдал 502, один тест завис на 120s — и прогон оборвался на 14%, без
# отчёта и без остальных 150 тестов. Потолок на тест нужен только в CI, поэтому
# он задаётся флагом в workflow (`--timeout=120`), а не глобально здесь.
# Локально от зависаний защищают таймауты Playwright ниже (действие 45s / навигация 60s).
addopts = --reruns 2 --reruns-delay 5
markers =
    real_submit: тест реально отправляет заявку/заказ на stage (создаёт лид). Отключить: -m "not real_submit"
    smoke: быстрый дымовой набор критичных проверок (login, поиск, корзина, каталог). Запуск: pytest -m smoke
    requires_auth: тесту нужен РЕАЛЬНЫЙ вход в личный кабинет. С IP GitHub Actions
        stage блокирует авторизацию (юзер остаётся гостем, в шапке висит «Войти»),
        поэтому в ночном CI такие тесты исключаются: -m "not requires_auth".
        Локально гоняются как обычно и проверяют кабинет по-настоящему.
