name: E2E Tests (stage.ecom.md)

# Black-box E2E прогон против живого стейджа. Доступ к коду ECOM не нужен —
# тесты ходят на https://stage.ecom.md по HTTP, как обычный браузер.
on:
  schedule:
    - cron: "0 2 * * *"          # каждую ночь ~02:00 UTC (~05:00 Кишинёв)
  # Ручной запуск кнопкой в Actions. Параметры нужны, чтобы можно было
  # ПЕРЕПРОВЕРИТЬ кабинет в CI, не редактируя этот файл: блокировка логина с
  # IP GitHub — наблюдение, а не закон природы, и она может отвалиться.
  # Дефолты повторяют ночной прогон один в один, так что cron не меняется.
  workflow_dispatch:
    inputs:
      markers:
        description: 'Выражение -m (пусто = вся суита, как ночью)'
        default: ''
        required: false
      paths:
        description: 'Ограничить прогон путями (пусто = вся суита)'
        default: ''
        required: false
      k_filter:
        description: 'Фильтр -k по именам тестов (пусто = без фильтра)'
        default: ''
        required: false
      workers:
        description: 'Параллельных воркеров (1 = последовательно, как раньше)'
        default: '4'
        required: false
  # Полную суиту по каждому пушу не гоняем (долго + флаки под нагрузкой) —
  # на пуш работает быстрый smoke (.github/workflows/smoke.yml).

# Не копим параллельные прогоны на одной ветке — отменяем предыдущий.
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    # Потолок оставлен с запасом (прогон стал параллельным, см. шаг прогона, но
    # стенд под нагрузкой умеет тормозить, и упереться в стену без отчёта — хуже,
    # чем простаивающий лимит). Жёсткую остановку с гарантией отчёта держит
    # --session-timeout=5400 (90 мин) в шаге прогона.
    #
    # ИСТОРИЯ: раньше здесь стояло «параллелить сознательно не стали — стейдж
    # залипает под нагрузкой». Решение пересмотрено 2026-09-02 ПО ЗАМЕРАМ, а не
    # по желанию: навигация + гидрация + networkidle на стенде занимают ~1.65 c
    # (замер по 6 прогонов на главной и каталоге), то есть стенд НЕ является
    # узким местом — им была последовательность. Прогон tests/test_search.py:
    # 173 c последовательно → 87 c на 4 воркерах, 18/18 зелёные. На 8 воркерах
    # уже медленнее (94 c) — упираемся в CPU, поэтому 4, а не «побольше».
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browser (chromium)
        run: python -m playwright install --with-deps chromium

      # users.json (реальные учётки) лежит в .gitignore и в репо его нет.
      # Пишем его из секрета USERS_JSON. Если секрет не задан — копируем
      # example, чтобы коллекция не падала (логин-тесты тогда упадут осмысленно).
      - name: Provision test credentials
        env:
          USERS_JSON: ${{ secrets.USERS_JSON }}
        run: |
          if [ -n "$USERS_JSON" ]; then
            printf '%s' "$USERS_JSON" > tests/fixtures/users.json
            echo "users.json written from secret"
          else
            cp tests/fixtures/users.example.json tests/fixtures/users.json
            echo "::warning::USERS_JSON secret not set — using example creds (login-зависимые тесты упадут)"
          fi

      # =====================================================================
      # ПЕРВЫЙ ЭТАП идёт на Виде 1 (корзина поп-апом) — но раньше это было
      # НАДЕЖДОЙ, а не условием: workflow возвращал Вид 1 в конце и молча
      # предполагал, что за сутки стенд никто не трогал.
      #
      # В ночь на 2026-08-20 предположение не выполнилось: прогон 32209900055
      # корректно вернул Вид 1 в 03:41, но к 02:48 следующей ночи на стенде
      # снова стоял Вид 2 (переключили вручную днём — CI между этими точками
      # вида не касался). Вся суита отработала против чужой конфигурации:
      # 28 ERROR в корзине и чекауте («.modal__cart.show не найден», при этом
      # page.url == /ru/cart) плюс 3 падения в соседних файлах. Продукт был
      # полностью исправен.
      #
      # Поэтому вид теперь ПРИВОДИТСЯ к нужному перед прогоном, а не
      # проверяется постфактум. `continue-on-error` — потому что не смогли
      # переключить ≠ надо валить ночь: тесты Вида 1 в этом случае аккуратно
      # скипнутся по `require_cart_view` с внятным текстом.
      # =====================================================================
      - name: Ensure cart view 1
        if: always()
        continue-on-error: true
        env:
          ALLOW_CART_VIEW_SWITCH: "1"
        run: python tools/cart_view.py set default

      # ВАЖНО: гоняем в --headed под Xvfb. На стейдже headless-сабмиты
      # предзаказа/заявок блокируются бот-защитой → в headless они дают
      # ложные падения. Под виртуальным дисплеем (Xvfb) браузер «headed»,
      # и реальные сабмиты проходят штатно. Лиды на стейдже не важны.
      #
      # --session-timeout=5400 (90 мин): страховка от стены job'а (120 мин).
      # Раньше стоял 6300 (105 мин), но однажды прогон всё равно упёрся в
      # 120-мин стену (report.html не успел, артефакты потеряли) — 15-мин
      # буфера не хватило. Даём 30 мин запаса: pytest мягко выходит на 90-й
      # минуте, текущий тест дорабатывает (≤120s по --timeout), отчёт генерится
      # и грузится с большим запасом. Лучше «прогнали сколько успели + есть
      # отчёт», чем hard-kill без артефактов.
      #
      # БЕЗ --tracing: на флакающем стейдже десятки (в основном ложных) падений
      # плодили сотни МБ трейсов за ночь и забивали storage-квоту аккаунта
      # (500 МБ) → upload-artifact начал падать с "storage quota has been hit".
      # Фейлы мы и так перепроверяем вживую (MCP/браузер), трейсы почти не
      # использовали. Оставляем только скриншоты фейлов, вшитые в self-contained
      # report.html — этого хватает для триажа, а весит на порядок меньше. Бонус:
      # без записи трейсов в teardown прогон ещё и быстрее (меньше давит на стену).
      #
      # --reruns 1 (override pytest.ini, где 2): на флакающем стейдже двойной
      # ретрай ×120s раздувает бюджет; одиночного ретрая хватает погасить флак,
      # а суммарное время прогона падает ~на треть.
      # --timeout=120 задаётся ЗДЕСЬ, а не в pytest.ini: на Windows (локальные
      # прогоны) pytest-timeout умеет только метод thread, который убивает весь
      # процесс pytest вместо одного теста — прогон обрывается без отчёта.
      # В CI (Linux) выбирается метод signal, где потолок работает как задумано.
      # Кабинет СНОВА В НОЧНОМ ПРОГОНЕ (2026-08-17).
      # Раньше здесь стоял -m "not requires_auth": с IP GitHub Actions стейдж
      # блокировал авторизацию (юзер оставался гостем, в шапке «Войти»), из-за
      # чего кабинет давал 11 гарантированных ERROR каждую ночь и job был
      # красным ВСЕГДА — по нему нельзя было понять, есть ли настоящая проблема.
      #
      # Перепроверено прогонами 32010476063 и 32010852092: логин с CI-IP
      # проходит, все 23 теста кабинета зелёные за 9м08с, скипов нет. Блокировка
      # была НАБЛЮДЕНИЕМ (июнь), а не свойством стенда, и она отвалилась.
      # Дефолт маркеров теперь пустой — гоняем всё.
      #
      # Если блокировка вернётся, кабинет снова начнёт валить прогон целиком:
      # тогда вернуть сюда 'not requires_auth' как дефолт MARKERS, а не чинить
      # тесты — они исправны, непроверяем сам сценарий с этого IP.
      #
      # NB: test_change_password_success реально меняет пароль общей учётки и
      # возвращает его обратно (в тесте + финализатор фикстуры). Если job
      # прибьют ЖЁСТКО между двумя сменами, финализатор не отработает и учётка
      # останется с временным паролем — тогда упадёт весь кабинет и локально.
      # Пароль для восстановления вручную — в TEMP_PASSWORD
      # (tests/account/test_password_change.py).
      - name: Run E2E tests (headed via Xvfb)
        env:
          # Для cron/расписания inputs пустой — гоняем всю суиту.
          MARKERS: ${{ inputs.markers }}
          PATHS: ${{ inputs.paths }}
          K_FILTER: ${{ inputs.k_filter }}
          # Для cron инпутов нет — подставляем дефолт здесь же.
          WORKERS: ${{ inputs.workers || '4' }}
        run: |
          echo "Прогон: ${MARKERS:+-m \"$MARKERS\"}${MARKERS:-вся суита}${PATHS:+ | пути: $PATHS}${K_FILTER:+ | -k $K_FILTER} | воркеров: $WORKERS"
          # -m подставляем ТОЛЬКО когда маркеры заданы: пустое `-m ""` — это не
          # «без фильтра», а пустое выражение, и полагаться на то, как его
          # истолкует pytest, в ночном прогоне не стоит.
          #
          # --dist loadgroup обязателен вместе с -n: раскладку задаёт хук
          # pytest_collection_modifyitems в conftest.py (файл целиком — на один
          # воркер, весь кабинет — на один и по очереди, т.к. учётка общая и
          # тест смены пароля ломает соседей). Любой другой режим --dist
          # рассыплет тесты поштучно и даст ложные падения.
          # Воркеров 4: замер 2026-09-02 показал, что 8 уже медленнее 4 (CPU).
          xvfb-run --auto-servernum \
            pytest --headed --browser chromium \
                   ${MARKERS:+-m "$MARKERS"} \
                   ${PATHS} \
                   ${K_FILTER:+-k "$K_FILTER"} \
                   -n "$WORKERS" --dist loadgroup \
                   --reruns 1 \
                   --timeout=120 \
                   --session-timeout=5400 \
                   --screenshot=only-on-failure \
                   --output=test-results \
                   --html=report.html --self-contained-html \
                   --css=assets/report.css

      # =====================================================================
      # ВТОРОЙ ЭТАП: корзина «Вид 2 — отдельная страница».
      #
      # Виды корзины взаимоисключающие: при Виде 1 корзина открывается
      # поп-апом и страницы /cart НЕТ, при Виде 2 — наоборот. Проверить оба за
      # один прогон можно только переключив стенд.
      #
      # Почему это допустимо здесь и запрещено локально: настройка глобальная
      # и общая с ручной работой. Ночью на стенде никто не работает, поэтому
      # переключаем только тут — скрипт требует ALLOW_CART_VIEW_SWITCH=1 и без
      # него откажется работать.
      #
      # Переключение не «подождать и надеяться»: скрипт опрашивает фронт, пока
      # настройка реально не приедет в SSR-пейлоад. Замер 2026-08-18 — около
      # 30 c на полный цикл в одну сторону.
      # =====================================================================
      - name: Switch cart to view 2
        id: switch_cart
        if: always()
        continue-on-error: true   # не смогли переключить — не валим прогон
        env:
          ALLOW_CART_VIEW_SWITCH: "1"
        run: python tools/cart_view.py set casadeltabaco

      # Гоняем только тесты корзины-страницы. Остальная суита уже отработала
      # на Виде 1; прогонять её повторно смысла нет, а время стоит дорого.
      #
      # `!cancelled()` обязателен. Без него условие выглядит достаточным, но
      # GitHub к `if` без статус-функции неявно дописывает `success()` — то есть
      # «и все предыдущие шаги зелёные». В прогоне 32209900055 переключение вида
      # прошло штатно (применилось за 9 c), но основной pytest завершился с
      # одним падением, и этот шаг молча пропустился: все 14 тестов Вида 2 за ту
      # ночь не проверялись вообще. Второй этап не должен зависеть от результата
      # первого — он про другую конфигурацию стенда. На отмене прогона шаг
      # по-прежнему не стартует.
      - name: Run cart view 2 tests
        if: ${{ !cancelled() && steps.switch_cart.outcome == 'success' }}
        run: |
          xvfb-run --auto-servernum \
            pytest --headed --browser chromium \
                   tests/test_cart_page.py \
                   --reruns 1 \
                   --timeout=120 \
                   --screenshot=only-on-failure \
                   --output=test-results-cart2 \
                   --html=report-cart-view2.html --self-contained-html \
                   --css=assets/report.css

      # ВСЕГДА возвращаем Вид 1: иначе стенд останется в чужом виде и утром
      # сломает ручную проверку. `if: always()` обязателен — шаг должен
      # отработать и после падения тестов выше, и после отмены прогона.
      - name: Restore cart view 1
        if: always()
        env:
          ALLOW_CART_VIEW_SWITCH: "1"
        run: python tools/cart_view.py set default

      # Единственный артефакт — self-contained report.html (пасс/фейл-таблица
      # + вшитые скриншоты фейлов). test-results/ отдельно не грузим: трейсов
      # больше нет, а скриншоты уже внутри отчёта. retention 2 дня: держим
      # storage-квоту аккаунта под контролем (ночной прогон каждый день).
      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-html-report
          path: |
            report.html
            report-cart-view2.html
          retention-days: 2
