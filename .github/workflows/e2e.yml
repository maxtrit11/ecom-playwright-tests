name: E2E Tests (stage.ecom.md)

# Black-box E2E прогон против живого стейджа. Доступ к коду ECOM не нужен —
# тесты ходят на https://stage.ecom.md по HTTP, как обычный браузер.
#
# =====================================================================
# ПОЧЕМУ ПРОГОН РАЗБИТ НА НЕСКОЛЬКО JOB'ОВ, А НЕ НА ВОРКЕРОВ
#
# Суита шла последовательно и занимала ~57 минут (job целиком — 64).
# Очевидная идея «дать pytest -n 4» ПРОВЕРЕНА И ОТКЛОНЕНА 2026-09-02:
# прогон 33617917187 с 4 воркерами не уложился и в 96 минут. Причина —
# на ubuntu-latest всего 4 ядра, а браузеры мы обязаны гонять HEADED под
# Xvfb (в headless стенд отдаёт урезанный контент, см. ниже). Без
# видеокарты страницы рисует процессор, и четыре браузера душат друг
# друга. Локальный замер (12 ядер, headless: 51м42с → 27м35с) на CI НЕ
# ПЕРЕНОСИТСЯ — не повторять эту ошибку замера.
# Побочно выяснилось, что под xdist не работает `--session-timeout`:
# мягкой остановки не случилось, прогон шёл к жёсткой стене job'а, а у
# отменённого прогона артефактов оказалось 0.
#
# Работает другое: РАЗНЫЕ JOB'Ы. Каждый получает собственный раннер со
# своими 4 ядрами, браузеры не конкурируют, внутри job'а всё как раньше —
# последовательно и headed. Суммарно списанных минут примерно столько же
# (~68 против ~64), а ждать вместо часа около 20 минут.
#
# Раскладка шардов сделана ПО ЗАМЕРАМ из ночного отчёта (run 33599678827),
# а не на глаз: 14.8 / 13.8 / 13.2 / 13.3 мин. Если добавишь много тестов
# в один файл — перебалансируй, иначе один job станет горлышком.
# Кабинет (tests/account) держим ОДНИМ шардом целиком: там общая учётка
# stage, и test_change_password_success меняет ей пароль посреди прогона —
# разложи кабинет по разным раннерам, и соседи получат «Неверный логин или
# пароль» на исправном продукте.
# =====================================================================
on:
  schedule:
    - cron: "0 2 * * *"          # каждую ночь ~02:00 UTC (~05:00 Кишинёв)
  # Ручной запуск кнопкой в Actions. Параметры нужны, чтобы можно было
  # ПЕРЕПРОВЕРИТЬ кабинет в CI, не редактируя этот файл: блокировка логина с
  # IP GitHub — наблюдение, а не закон природы, и она может отвалиться.
  # Дефолты повторяют ночной прогон один в один, так что cron не меняется.
  workflow_dispatch:
    inputs:
      markers:
        description: 'Выражение -m (пусто = вся суита, как ночью)'
        default: ''
        required: false
      paths:
        description: 'Ограничить прогон путями (пусто = вся суита). Непустое значение гоняется ТОЛЬКО на шарде 1, остальные шарды пропускают прогон'
        default: ''
        required: false
      k_filter:
        description: 'Фильтр -k по именам тестов (пусто = без фильтра)'
        default: ''
        required: false
      workers:
        description: 'Воркеров pytest ВНУТРИ одного шарда (1 = последовательно; больше 1 в CI ЗАМЕДЛЯЕТ, см. комментарий сверху)'
        default: '1'
        required: false
  # Полную суиту по каждому пушу не гоняем (долго + флаки под нагрузкой) —
  # на пуш работает быстрый smoke (.github/workflows/smoke.yml).

# Не копим параллельные прогоны на одной ветке — отменяем предыдущий.
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =====================================================================
  # Вид корзины приводится к Виду 1 ОДИН РАЗ и ДО шардов — отдельным job'ом.
  #
  # Настройка глобальная и одна на весь стенд. Делать её внутри каждого
  # шарда нельзя: четыре раннера начали бы писать её одновременно, а
  # переключение занимает ~30 c и проходит через админку и сброс кэша.
  #
  # Почему вид вообще приводится, а не проверяется постфактум: в ночь на
  # 2026-08-20 прогон 32209900055 корректно вернул Вид 1 в 03:41, но к 02:48
  # следующей ночи на стенде снова стоял Вид 2 (переключили вручную днём —
  # CI между этими точками вида не касался). Вся суита отработала против
  # чужой конфигурации: 28 ERROR в корзине и чекауте («.modal__cart.show не
  # найден», при этом page.url == /ru/cart) плюс 3 падения в соседних файлах.
  # Продукт был полностью исправен.
  #
  # `continue-on-error` — потому что не смогли переключить ≠ надо валить
  # ночь: тесты Вида 1 в этом случае аккуратно скипнутся по
  # `require_cart_view` с внятным текстом.
  # =====================================================================
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.shards.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      # У шардинга есть собственный, очень неприятный отказ: новый файл тестов,
      # который забыли вписать в раскладку, просто НЕ ГОНЯЕТСЯ — прогон при этом
      # зелёный, и заметить это можно только случайно. Поэтому раскладка лежит в
      # tools/shards.json (единственный источник правды: матрица берётся оттуда
      # же), а этот шаг падает, если хоть один tests/test_*.py не покрыт.
      # `continue-on-error` тут НЕ ставим сознательно — молча гонять неполную
      # суиту хуже, чем не гонять вовсе.
      - name: Check shard coverage
        id: shards
        run: |
          python tools/shards.py check
          echo "matrix=$(python tools/shards.py matrix)" >> "$GITHUB_OUTPUT"

      - name: Ensure cart view 1
        continue-on-error: true
        env:
          ALLOW_CART_VIEW_SWITCH: "1"
        run: python tools/cart_view.py set default

  e2e:
    needs: prepare
    # Условие ДЕФОЛТНОЕ (то есть «prepare зелёный») — и это намеренно.
    # `prepare` падает ровно в одном случае: раскладка шардов неполна, какой-то
    # файл тестов не гоняется. Тогда прогон и должен остановиться, а не выдать
    # зелёный результат по неполной суите. Приведение вида корзины на это не
    # влияет: у того шага `continue-on-error`, job из-за него не краснеет.
    # Плюс без успешного `prepare` не будет и матрицы — она его output.
    runs-on: ubuntu-latest
    # Самый длинный шард — ~15 мин. 60 с запасом на тормоза стенда и ретраи;
    # мягкую остановку с гарантией отчёта держит --session-timeout=3000 (50 мин).
    timeout-minutes: 60
    strategy:
      # Упавший шард НЕ должен отменять остальные: они про другие тесты, и
      # их результат нужен целиком, иначе утренний разбор неполный.
      fail-fast: false
      # Матрица приезжает из tools/shards.json через job `prepare` — чтобы
      # раскладка и её проверка на полноту жили в одном месте, а не в двух,
      # где они неизбежно разъедутся.
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    name: "e2e ${{ matrix.shard }}: ${{ matrix.title }}"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browser (chromium)
        run: python -m playwright install --with-deps chromium

      # users.json (реальные учётки) лежит в .gitignore и в репо его нет.
      # Пишем его из секрета USERS_JSON. Если секрет не задан — копируем
      # example, чтобы коллекция не падала (логин-тесты тогда упадут осмысленно).
      - name: Provision test credentials
        env:
          USERS_JSON: ${{ secrets.USERS_JSON }}
        run: |
          if [ -n "$USERS_JSON" ]; then
            printf '%s' "$USERS_JSON" > tests/fixtures/users.json
            echo "users.json written from secret"
          else
            cp tests/fixtures/users.example.json tests/fixtures/users.json
            echo "::warning::USERS_JSON secret not set — using example creds (login-зависимые тесты упадут)"
          fi

      # ВАЖНО: гоняем в --headed под Xvfb. На стейдже headless-сабмиты
      # предзаказа/заявок блокируются бот-защитой → в headless они дают
      # ложные падения. Под виртуальным дисплеем (Xvfb) браузер «headed»,
      # и реальные сабмиты проходят штатно. Лиды на стейдже не важны.
      #
      # --session-timeout=3000 (50 мин): страховка от стены job'а (60 мин).
      # Смысл прежний — «прогнали сколько успели, но отчёт есть» лучше, чем
      # hard-kill без артефактов. NB: под xdist эта страховка НЕ РАБОТАЕТ
      # (проверено 2026-09-02), поэтому воркеров внутри шарда держим = 1.
      #
      # БЕЗ --tracing: на флакающем стейдже десятки (в основном ложных) падений
      # плодили сотни МБ трейсов за ночь и забивали storage-квоту аккаунта
      # (500 МБ) → upload-artifact начал падать с "storage quota has been hit".
      # Фейлы мы и так перепроверяем вживую (MCP/браузер), трейсы почти не
      # использовали. Оставляем только скриншоты фейлов, вшитые в self-contained
      # report.html — этого хватает для триажа, а весит на порядок меньше. Бонус:
      # без записи трейсов в teardown прогон ещё и быстрее.
      #
      # --reruns 1 (override pytest.ini, где 2): на флакающем стейдже двойной
      # ретрай ×120s раздувает бюджет; одиночного ретрая хватает погасить флак,
      # а суммарное время прогона падает ~на треть.
      # --timeout=120 задаётся ЗДЕСЬ, а не в pytest.ini: на Windows (локальные
      # прогоны) pytest-timeout умеет только метод thread, который убивает весь
      # процесс pytest вместо одного теста — прогон обрывается без отчёта.
      # В CI (Linux) выбирается метод signal, где потолок работает как задумано.
      #
      # Кабинет СНОВА В НОЧНОМ ПРОГОНЕ (2026-08-17).
      # Раньше здесь стоял -m "not requires_auth": с IP GitHub Actions стейдж
      # блокировал авторизацию (юзер оставался гостем, в шапке «Войти»), из-за
      # чего кабинет давал 11 гарантированных ERROR каждую ночь и job был
      # красным ВСЕГДА — по нему нельзя было понять, есть ли настоящая проблема.
      # Перепроверено прогонами 32010476063 и 32010852092: логин с CI-IP
      # проходит, все 23 теста кабинета зелёные за 9м08с, скипов нет. Блокировка
      # была НАБЛЮДЕНИЕМ (июнь), а не свойством стенда, и она отвалилась.
      # Если блокировка вернётся, кабинет снова начнёт валить шард 1: тогда
      # вернуть 'not requires_auth' как дефолт MARKERS, а не чинить тесты —
      # они исправны, непроверяем сам сценарий с этого IP.
      #
      # NB: test_change_password_success реально меняет пароль общей учётки и
      # возвращает его обратно (в тесте + финализатор фикстуры). Если job
      # прибьют ЖЁСТКО между двумя сменами, финализатор не отработает и учётка
      # останется с временным паролем — тогда упадёт весь кабинет и локально.
      # Пароль для восстановления вручную — в TEMP_PASSWORD
      # (tests/account/test_password_change.py).
      - name: Run E2E tests (headed via Xvfb)
        # Ручной прогон с явными путями гоняем ТОЛЬКО на шарде 1: иначе одни и
        # те же тесты отработали бы четыре раза. Раннеры шардов 2-4 при этом
        # всё же поднимутся и сделают setup — это дешевле, чем условие на
        # уровне job'а (контекст matrix там недоступен).
        if: ${{ inputs.paths == '' || matrix.shard == 1 }}
        env:
          MARKERS: ${{ inputs.markers }}
          # Пути шарда; ручной ввод (inputs.paths) их перекрывает.
          PATHS: ${{ inputs.paths != '' && inputs.paths || matrix.paths }}
          K_FILTER: ${{ inputs.k_filter }}
          # Для cron инпутов нет — подставляем дефолт здесь же.
          WORKERS: ${{ inputs.workers || '1' }}
        run: |
          echo "Шард ${{ matrix.shard }} (${{ matrix.title }}): $PATHS"
          echo "Фильтры: ${MARKERS:+-m \"$MARKERS\"}${MARKERS:-без маркеров}${K_FILTER:+ | -k $K_FILTER} | воркеров: $WORKERS"
          # -m подставляем ТОЛЬКО когда маркеры заданы: пустое `-m ""` — это не
          # «без фильтра», а пустое выражение, и полагаться на то, как его
          # истолкует pytest, в ночном прогоне не стоит.
          #
          # При WORKERS=1 флаги xdist НЕ подставляем вовсе: `-n 1` — это всё
          # равно отдельный процесс-воркер со своей ценой и своими отличиями
          # (тот же неработающий --session-timeout). Дефолтный прогон должен
          # быть побайтово прежним, а не «почти прежним».
          #
          # --dist loadgroup обязателен вместе с -n: раскладку задаёт хук
          # pytest_collection_modifyitems в conftest.py (файл целиком — на один
          # воркер, весь кабинет — на один и по очереди). Любой другой режим
          # --dist рассыплет тесты поштучно и даст ложные падения.
          XDIST=""
          if [ "${WORKERS:-1}" != "1" ]; then
            XDIST="-n $WORKERS --dist loadgroup"
            echo "::warning::Параллель воркерами на одном раннере замедляет headed-прогон (см. комментарий в e2e.yml)"
          fi
          xvfb-run --auto-servernum \
            pytest --headed --browser chromium \
                   ${MARKERS:+-m "$MARKERS"} \
                   ${PATHS} \
                   ${K_FILTER:+-k "$K_FILTER"} \
                   ${XDIST} \
                   --reruns 1 \
                   --timeout=120 \
                   --session-timeout=3000 \
                   --screenshot=only-on-failure \
                   --output=test-results \
                   --html=report.html --self-contained-html \
                   --css=assets/report.css

      # Артефакт на шард: upload-artifact@v4 не даёт нескольким job'ам писать
      # в одно имя, поэтому отчёты приезжают отдельными файлами и утром их
      # четыре. Внутри каждого — привычная пасс/фейл-таблица со вшитыми
      # скриншотами падений. retention 2 дня: держим storage-квоту аккаунта
      # под контролем (ночной прогон каждый день).
      - name: Upload HTML report
        if: ${{ always() && (inputs.paths == '' || matrix.shard == 1) }}
        uses: actions/upload-artifact@v4
        with:
          name: pytest-html-report-shard-${{ matrix.shard }}
          path: report.html
          retention-days: 2

  # =====================================================================
  # ВТОРОЙ ЭТАП: корзина «Вид 2 — отдельная страница».
  #
  # Виды корзины взаимоисключающие: при Виде 1 корзина открывается поп-апом
  # и страницы /cart НЕТ, при Виде 2 — наоборот. Проверить оба за один
  # прогон можно только переключив стенд.
  #
  # Отдельным job'ом ПОСЛЕ всех шардов — это обязательное условие, а не
  # оформление: вид глобальный, и переключи его раньше времени, все ещё
  # бегущие шарды начали бы падать пачками на чужой конфигурации.
  #
  # Почему переключать вообще допустимо здесь и запрещено локально:
  # настройка общая с ручной работой. Ночью на стенде никто не работает,
  # поэтому переключаем только тут — скрипт требует ALLOW_CART_VIEW_SWITCH=1
  # и без него откажется работать.
  #
  # `!cancelled()` обязателен. Без него условие выглядит достаточным, но
  # GitHub к `if` без статус-функции неявно дописывает `success()` — то есть
  # «и всё предыдущее зелёное». В прогоне 32209900055 переключение вида
  # прошло штатно, но основной pytest завершился с одним падением, и шаг
  # молча пропустился: все 14 тестов Вида 2 за ту ночь не проверялись вообще.
  # Второй этап не должен зависеть от результата первого — он про другую
  # конфигурацию стенда.
  # =====================================================================
  cart-view-2:
    needs: e2e
    if: ${{ !cancelled() && inputs.paths == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium

      - name: Provision test credentials
        env:
          USERS_JSON: ${{ secrets.USERS_JSON }}
        run: |
          if [ -n "$USERS_JSON" ]; then
            printf '%s' "$USERS_JSON" > tests/fixtures/users.json
          else
            cp tests/fixtures/users.example.json tests/fixtures/users.json
          fi

      # Переключение не «подождать и надеяться»: скрипт опрашивает фронт, пока
      # настройка реально не приедет в SSR-пейлоад. Замер 2026-08-18 — около
      # 30 c на полный цикл в одну сторону.
      - name: Switch cart to view 2
        id: switch_cart
        continue-on-error: true   # не смогли переключить — не валим прогон
        env:
          ALLOW_CART_VIEW_SWITCH: "1"
        run: python tools/cart_view.py set casadeltabaco

      # Гоняем только тесты корзины-страницы. Остальная суита уже отработала
      # на Виде 1; прогонять её повторно смысла нет, а время стоит дорого.
      - name: Run cart view 2 tests
        if: ${{ !cancelled() && steps.switch_cart.outcome == 'success' }}
        run: |
          xvfb-run --auto-servernum \
            pytest --headed --browser chromium \
                   tests/test_cart_page.py \
                   --reruns 1 \
                   --timeout=120 \
                   --screenshot=only-on-failure \
                   --output=test-results-cart2 \
                   --html=report-cart-view2.html --self-contained-html \
                   --css=assets/report.css

      # ВСЕГДА возвращаем Вид 1: иначе стенд останется в чужом виде и утром
      # сломает и ручную проверку, и следующий ночной прогон. `if: always()`
      # обязателен — шаг должен отработать и после падения тестов выше, и
      # после отмены прогона.
      - name: Restore cart view 1
        if: always()
        env:
          ALLOW_CART_VIEW_SWITCH: "1"
        run: python tools/cart_view.py set default

      - name: Upload HTML report (cart view 2)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-html-report-cart-view2
          path: report-cart-view2.html
          retention-days: 2
