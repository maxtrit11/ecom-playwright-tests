name: Smoke Tests (stage.ecom.md)

# Быстрый дымовой набор: ~7 критичных проверок (каталог, поиск, товар+корзина,
# категория, пагинация, авторизация, личный кабинет/логин). Цель — за пару
# минут ответить «не сломалось ли что-то жизненно важное прямо сейчас».
# Запускается на каждый пуш с изменением тестов и вручную. Полная суита — в e2e.yml.
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "tests/**"
      - "conftest.py"
      - "pytest.ini"
      - "requirements.txt"
      - ".github/workflows/smoke.yml"

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browser (chromium)
        run: python -m playwright install --with-deps chromium

      # users.json (реальные учётки) в .gitignore — пишем его из секрета
      # USERS_JSON (нужен для смоук-теста личного кабинета). Без секрета —
      # копируем example, чтобы коллекция не падала.
      - name: Provision test credentials
        env:
          USERS_JSON: ${{ secrets.USERS_JSON }}
        run: |
          if [ -n "$USERS_JSON" ]; then
            printf '%s' "$USERS_JSON" > tests/fixtures/users.json
            echo "users.json written from secret"
          else
            cp tests/fixtures/users.example.json tests/fixtures/users.json
            echo "::warning::USERS_JSON secret not set — using example creds"
          fi

      # Гоняем headed под Xvfb (как полная суита): в headless стейдж отдаёт
      # деградированный контент с дата-центровых IP (анти-бот) — часть XHR-
      # элементов (.account-table, счётчик товаров) не подгружается, и тесты
      # ложно падают. Под виртуальным дисплеем браузер «headed» и всё грузится.
      - name: Run smoke tests (headed via Xvfb)
        run: |
          xvfb-run --auto-servernum \
            pytest -m smoke --headed --browser chromium \
                   --tracing=retain-on-failure \
                   --screenshot=only-on-failure \
                   --output=test-results \
                   --html=smoke-report.html --self-contained-html

      - name: Upload smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-report
          path: smoke-report.html
          retention-days: 5

      - name: Upload traces & screenshots (failures)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-artifacts
          path: test-results/
          retention-days: 5
          if-no-files-found: ignore
